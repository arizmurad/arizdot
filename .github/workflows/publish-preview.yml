name: Publish Windows preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-preview.yml']

# This workflow publishes only the explicitly reviewed first preview commit.
# Published releases are immutable here; a rerun can only repair its draft.
permissions:
  contents: read

concurrency:
  group: publish-v0.1.0-preview.1
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 83841537e1811c753cc086d48cb98002f84862bc
  RELEASE_TAG: v0.1.0-preview.1

jobs:
  publish:
    if: github.repository == 'arizmurad/arizdot' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify source and installers
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_COMMIT) { throw 'Unexpected source revision' }
          python -m pip install -r requirements-claude.txt
          if ($LASTEXITCODE) { throw 'Dependency installation failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Tests failed' }
          python install_windows.py --check
          if ($LASTEXITCODE) { throw 'Installer check failed' }
      - name: Build and validate all three packages
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys, textwrap, zipfile
          from pathlib import Path
          sys.path.insert(0, os.getcwd())
          from package_source import source_files, build_release
          stamp = int(subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD'], text=True).strip())
          for path in source_files():
              os.utime(path, (stamp, stamp))
          releases = build_release()
          common = None
          checksums = []
          for target, result in releases.items():
              path = Path(result['archive'])
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  manifest = json.loads(archive.read('ariztools/SOURCE-MANIFEST.json'))
                  assert json.loads(archive.read('ariztools/PACKAGE.json'))['target'] == target
                  assert len(manifest) == 106, 'Unexpected reviewed source file count'
                  for name, digest in manifest.items():
                      assert hashlib.sha256(archive.read('ariztools/' + name)).hexdigest() == digest, name
                  shared = {name: digest for name, digest in manifest.items() if name != 'PACKAGE.json'}
                  assert common is None or shared == common, 'Provider source differs'
                  common = shared
              checksums.append(result['sha256'] + '  ' + path.name + '\n')
          Path('dist/SHA256SUMS.txt').write_text(''.join(checksums), encoding='utf-8', newline='\n')
          # Reuse a successfully uploaded draft archive only after verifying
          # every member against this reviewed checkout (allowing Git EOLs).
          verifier = Path(os.environ['RUNNER_TEMP']) / 'verify_arizdot_archive.py'
          verifier.write_text(textwrap.dedent('''\
          import hashlib, json, os, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, os.getcwd())
          from package_source import source_files
          archive_path, target = sys.argv[1:]
          expected = {p.relative_to(Path.cwd()).as_posix(): p for p in source_files()}
          with zipfile.ZipFile(archive_path) as archive:
              assert archive.testzip() is None
              manifest = json.loads(archive.read('ariztools/SOURCE-MANIFEST.json'))
              assert set(manifest) == set(expected) | {'PACKAGE.json'}
              assert len(archive.namelist()) == len(manifest) + 1
              assert set(archive.namelist()) == {'ariztools/' + n for n in manifest} | {'ariztools/SOURCE-MANIFEST.json'}
              profile = json.loads(archive.read('ariztools/PACKAGE.json'))
              assert profile == {'target': target, 'version': Path('VERSION').read_text().strip()}
              for name, digest in manifest.items():
                  content = archive.read('ariztools/' + name)
                  assert hashlib.sha256(content).hexdigest() == digest, name
                  if name == 'PACKAGE.json':
                      continue
                  original = expected[name].read_bytes()
                  if expected[name].suffix not in ('.png', '.webp', '.gif'):
                      content = content.replace(b'\\r\\n', b'\\n')
                      original = original.replace(b'\\r\\n', b'\\n')
                  assert content == original, 'Unreviewed archive source: ' + name
          print('Verified reviewed source and profile:', target)
          '''), encoding='utf-8')
      - name: Retain verified packages
        uses: actions/upload-artifact@v4
        with:
          name: arizdot-v0.1.0-preview.1-windows
          path: |
            dist/arizdot-0.1.0-preview.1-*-windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload, download-verify, and publish the preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release view $env:RELEASE_TAG --json isDraft,assets 2>$null
          $existingAssets = @()
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'This release is already public; refusing to replace it' }
            $existingAssets = @(($existing | ConvertFrom-Json).assets)
            gh release edit $env:RELEASE_TAG --draft=true --prerelease --target $env:SOURCE_COMMIT --title 'arizdot v0.1.0-preview.1 — Codex and Claude for Windows' --notes-file docs/RELEASE-NOTES.md
          } else {
            gh release create $env:RELEASE_TAG --draft --prerelease --target $env:SOURCE_COMMIT --title 'arizdot v0.1.0-preview.1 — Codex and Claude for Windows' --notes-file docs/RELEASE-NOTES.md
          }
          if ($LASTEXITCODE) { throw 'Could not prepare the release draft' }
          $packages = @(Get-ChildItem -LiteralPath dist -Filter 'arizdot-0.1.0-preview.1-*-windows.zip')
          if ($packages.Count -ne 3) { throw 'Expected exactly three profiles' }
          $allowedNames = @($packages.Name) + @('SHA256SUMS.txt')
          foreach ($asset in $existingAssets) {
            if ($asset.name -notin $allowedNames) { throw "Unexpected draft asset: $($asset.name)" }
          }
          foreach ($file in $packages) {
            if ($file.Name -in $existingAssets.name) {
              $existingDir = Join-Path $env:RUNNER_TEMP $file.BaseName
              New-Item -ItemType Directory -Path $existingDir | Out-Null
              gh release download $env:RELEASE_TAG --dir $existingDir --pattern $file.Name
              if ($LASTEXITCODE) { throw "Could not read existing asset: $($file.Name)" }
              $existingFile = Join-Path $existingDir $file.Name
              $profile = $file.Name -replace '^arizdot-0.1.0-preview.1-', '' -replace '-windows.zip$', ''
              python (Join-Path $env:RUNNER_TEMP 'verify_arizdot_archive.py') $existingFile $profile
              if ($LASTEXITCODE) { throw "Existing asset does not match reviewed source: $($file.Name)" }
              Copy-Item -LiteralPath $existingFile -Destination $file.FullName
              continue
            }
            $uploaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release upload $env:RELEASE_TAG $file.FullName
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              Start-Sleep -Seconds 3
            }
            if (-not $uploaded) { throw "Upload failed: $($file.Name)" }
          }
          $checksumText = ($packages | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name }) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), $checksumText + "`n", [System.Text.UTF8Encoding]::new($false))
          $checksum = Get-Item -LiteralPath dist/SHA256SUMS.txt
          if ('SHA256SUMS.txt' -notin $existingAssets.name) {
            gh release upload $env:RELEASE_TAG $checksum.FullName
            if ($LASTEXITCODE) { throw 'Checksum upload failed' }
          }
          $files = @($packages) + @($checksum)
          $download = Join-Path $env:RUNNER_TEMP 'arizdot-release-verification'
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $env:RELEASE_TAG --dir $download --pattern '*.zip' --pattern SHA256SUMS.txt
          if ($LASTEXITCODE) { throw 'Release download verification failed' }
          foreach ($file in $files) {
            $expected = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            $actual = (Get-FileHash -LiteralPath (Join-Path $download $file.Name) -Algorithm SHA256).Hash
            if ($expected -ne $actual) { throw "Download checksum mismatch: $($file.Name)" }
          }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease --latest=false
          if ($LASTEXITCODE) { throw 'Publishing failed; verified files remain in the draft' }
          gh release view $env:RELEASE_TAG --json url,isDraft,isPrerelease,assets
          if ($LASTEXITCODE) { throw 'Could not verify the published release' }
